[project]
name = "cohort-lens"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3",
  "psycopg[binary]>=3.2,<4",
  "duckdb>=1.5,<2",
  "bcrypt>=4,<6",
  "gunicorn>=23,<25",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4,<5", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["src"]
testpaths = ["tests/django"]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["src/**/*.py", "tests/django/**/*.py", "manage.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

services:
  postgres:
    image: postgres:16
    shm_size: 1gb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-only}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local-app-only}
      CLINICAL_DB_PASSWORD: ${CLINICAL_DB_PASSWORD:-local-clinical-read-only}
      CLINICAL_IMPORT_DB_PASSWORD: ${CLINICAL_IMPORT_DB_PASSWORD:-local-clinical-import}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    build: .
    ports:
      - "4173:4173"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-change-before-sharing}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      APP_DB_HOST: postgres
      APP_DB_NAME: application_db
      APP_DB_USER: app_writer
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local-app-only}
      CLINICAL_DB_HOST: postgres
      CLINICAL_DB_NAME: clinical_db
      CLINICAL_DB_USER: clinical_reader
      CLINICAL_DB_PASSWORD: ${CLINICAL_DB_PASSWORD:-local-clinical-read-only}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_ALLOWED_EMAILS: ${GOOGLE_ALLOWED_EMAILS:-}
      DEMO_ACCOUNT_ENABLED: ${DEMO_ACCOUNT_ENABLED:-1}
      DEMO_ACCOUNT_EMAIL: ${DEMO_ACCOUNT_EMAIL:-researcher@example.com}
      DEMO_ACCOUNT_PASSWORD: ${DEMO_ACCOUNT_PASSWORD:-ChangeMe123!}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
